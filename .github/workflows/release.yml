name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  build-binaries:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            ext: ''
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            ext: ''
          - os: darwin
            arch: x64
            runner: macos-13
            ext: ''
          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: ''
          - os: win32
            arch: x64
            runner: windows-latest
            ext: .exe
          - os: win32
            arch: arm64
            runner: windows-latest
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build standalone binary
        shell: bash
        run: |
          mkdir -p dist
          bun build ./cli/src/index.ts --compile --outfile "dist/wayforge-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" --define "process.env.WAYFORGE_VERSION:$(cat VERSION)"

      - uses: actions/upload-artifact@v4
        with:
          name: wayforge-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          path: dist/wayforge-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  release:
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Extract latest changelog entry
        id: changelog
        run: |
          awk '/^## \[/{if(++c>1)exit}c' CHANGELOG.md > /tmp/release_body.md
          echo "body_file=/tmp/release_body.md" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          pattern: wayforge-*
          path: dist/
          merge-multiple: true

      - name: Create share archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar -czf "wayforge-share-${VERSION}.tar.gz" base VERSION
          python3 -m zipfile -c "wayforge-share-${VERSION}.zip" base VERSION

      - name: Create Release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          echo "Creating release for $TAG"
          if gh release view "$TAG" --repo ${{ github.repository }} &>/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${{ steps.changelog.outputs.body_file }}" \
            --repo ${{ github.repository }}
          gh release upload "$TAG" dist/wayforge-* wayforge-share-${{ steps.version.outputs.version }}.tar.gz wayforge-share-${{ steps.version.outputs.version }}.zip install/install.sh install/install.ps1 --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
