name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  build-binaries:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: x64
            runner: macos-13
          - os: darwin
            arch: arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build standalone binary
        run: |
          mkdir -p dist
          bun build ./cli/src/index.ts --compile --outfile "dist/ai-config-${{ matrix.os }}-${{ matrix.arch }}" --define "process.env.AI_CONFIG_VERSION:$(cat VERSION)"

      - uses: actions/upload-artifact@v4
        with:
          name: ai-config-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/ai-config-${{ matrix.os }}-${{ matrix.arch }}

  release:
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Extract latest changelog entry
        id: changelog
        run: |
          awk '/^## \[/{if(++c>1)exit}c' CHANGELOG.md > /tmp/release_body.md
          echo "body_file=/tmp/release_body.md" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          pattern: ai-config-*
          path: dist/
          merge-multiple: true

      - name: Create Release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          echo "Creating release for $TAG"
          if gh release view "$TAG" --repo ${{ github.repository }} &>/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${{ steps.changelog.outputs.body_file }}" \
            --repo ${{ github.repository }}
          gh release upload "$TAG" dist/ai-config-* --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
