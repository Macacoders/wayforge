name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  build-binaries:
    runs-on: [self-hosted, linux, x64]
    strategy:
      matrix:
        include:
          - os: linux
            arch: x64
            target: bun-linux-x64
            ext: ''
          - os: linux
            arch: arm64
            target: bun-linux-arm64
            ext: ''
          - os: darwin
            arch: x64
            target: bun-darwin-x64
            ext: ''
          - os: darwin
            arch: arm64
            target: bun-darwin-arm64
            ext: ''
          - os: win32
            arch: x64
            target: bun-windows-x64
            ext: .exe
          - os: win32
            arch: arm64
            target: bun-windows-arm64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build standalone binary
        shell: bash
        run: |
          mkdir -p dist
          bun build ./cli/src/index.ts --compile \
            --target=${{ matrix.target }} \
            --outfile "dist/wayforge-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" \
            --define "process.env.WAYFORGE_VERSION:'$(cat VERSION)'"

      - uses: actions/upload-artifact@v4
        with:
          name: wayforge-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          path: dist/wayforge-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  release:
    runs-on: [self-hosted, linux, x64]
    needs: build-binaries
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Extract latest changelog entry
        id: changelog
        run: |
          awk '/^## \[/{if(++c>1)exit}c' CHANGELOG.md > /tmp/release_body.md
          echo "body_file=/tmp/release_body.md" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          pattern: wayforge-*
          path: dist/
          merge-multiple: true

      - name: Create share archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar -czf "wayforge-share-${VERSION}.tar.gz" base VERSION
          python3 -m zipfile -c "wayforge-share-${VERSION}.zip" base VERSION

      - name: Generate checksums
        shell: bash
        run: |
          {
            sha256sum dist/wayforge-* wayforge-share-*.tar.gz wayforge-share-*.zip
            (cd install && sha256sum install.sh install.ps1)
          } > wayforge-checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.1.4'

      - name: Sign checksum manifest (keyless)
        shell: bash
        run: |
          cosign sign-blob --yes \
            --bundle wayforge-checksums.txt.sigstore.json \
            wayforge-checksums.txt

      - name: Create Release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          echo "Creating release for $TAG"
          if gh release view "$TAG" --repo ${{ github.repository }} &>/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${{ steps.changelog.outputs.body_file }}" \
            --repo ${{ github.repository }}
          gh release upload "$TAG" dist/wayforge-* wayforge-share-${{ steps.version.outputs.version }}.tar.gz wayforge-share-${{ steps.version.outputs.version }}.zip wayforge-checksums.txt wayforge-checksums.txt.sigstore.json install/install.sh install/install.ps1 --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
