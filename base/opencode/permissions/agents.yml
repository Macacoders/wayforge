# Parse contract: flat YAML, no anchors/merge keys, full-line comments only.
# Parsed by the TypeScript CLI (cli/src/lib/permissions.ts) and the legacy bash/ps1
# managed_sync renderers — see ADR-0009 and ADR-0014.
#
# Permission model: coarse last-match-wins bash rules. "*": allow is the catch-all
# (prompting on every benign command such as rg/ls/cat would be too slow); a short
# deny-list below it blocks known high-risk prefixes. Destructive commands are also
# gated by the user's shell/profile permissions.
agents:
  planner:
    read: allow
    edit: ask
    question: allow
    bash:
      "*": allow
      "sudo*": deny
      "rm -rf*": deny
      "git push --force*": deny
      "git push -f*": deny
    external_directory:
      "*": deny
      "/tmp/**": allow
    task:
      "*": deny
      research: allow
      code: allow
      architect: allow

  delivery:
    read: allow
    edit: ask
    question: allow
    bash:
      "*": allow
      "sudo*": deny
      "rm -rf*": deny
      "git push --force*": deny
      "git push -f*": deny
    external_directory:
      "*": deny
      "/tmp/**": allow
    task:
      "*": deny
      research: allow
      code: allow
      architect: allow
      reviewer: allow

  research:
    read: allow
    edit: ask
    bash:
      "*": allow
      "sudo*": deny
      "rm -rf*": deny
      "git push --force*": deny
      "git push -f*": deny
    external_directory:
      "*": deny
      "/tmp/**": allow
    task: deny

  code:
    read: allow
    edit: allow
    bash:
      "*": allow
      "sudo*": deny
      "rm -rf*": deny
      "git push --force*": deny
      "git push -f*": deny
      "git commit*": deny
      "git push*": deny
      "git tag*": deny
    external_directory:
      "*": deny
      "/tmp/**": allow
    task: deny

  # reviewer is the independent verification agent: it must be able to inspect git evidence
  # and run read-only checks, but never modify product code. edit: deny is the primary control;
  # the extra bash denies cover the common shell write paths (see ADR-0036 and ADR-0048's
  # residual-risk notes).
  reviewer:
    read: allow
    edit: deny
    bash:
      "*": allow
      "sudo*": deny
      "rm -rf*": deny
      "rm *": deny
      "mv *": deny
      "cp *": deny
      "tee*": deny
      "truncate*": deny
      "sed -i*": deny
      "git add*": deny
      "git commit*": deny
      "git push*": deny
      "git push --force*": deny
      "git push -f*": deny
      "git merge*": deny
      "git rebase*": deny
      "git reset*": deny
      "git checkout*": deny
      "git switch*": deny
      "git restore*": deny
      "git stash*": deny
      "git apply*": deny
      "git rm*": deny
      "git tag*": deny
    external_directory:
      "*": deny
      "/tmp/**": allow
    task: deny

  troubleshooter:
    read: allow
    edit: ask
    question: allow
    bash:
      "*": allow
      "sudo*": deny
      "rm -rf*": deny
      "git push --force*": deny
      "git push -f*": deny
    external_directory:
      "*": deny
      "/tmp/**": allow
    task: deny

  architect:
    read: allow
    edit: deny
    bash:
      "*": allow
      "sudo*": deny
      "rm -rf*": deny
      "git push --force*": deny
      "git push -f*": deny
    external_directory:
      "*": deny
      "/tmp/**": allow
    task: deny
