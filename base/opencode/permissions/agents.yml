# Parse contract: flat YAML, no anchors/merge keys, full-line comments only.
# Parsed by the TypeScript CLI (cli/src/lib/permissions.ts) and the legacy bash/ps1
# managed_sync renderers — see ADR-0009 and ADR-0014.
#
# Permission model: native tools and named skills are explicitly allowed; shell commands
# require approval unless a role needs one narrow automatic exception. edit controls edit,
# write, and apply_patch. External paths are denied for every role.
agents:
  planner:
    read: allow
    glob: allow
    grep: allow
    skill:
      "*": deny
      ai-memory: allow
      create-skill: allow
      delivery-policy: allow
      intent: allow
      memory-maintenance: allow
      plan: allow
      ponytail: allow
      ponytail-audit: allow
      ponytail-debt: allow
      ponytail-gain: allow
      ponytail-help: allow
      shared-task: allow
      triage: allow
    webfetch: allow
    websearch: allow
    edit:
      "*": deny
      "docs/ai/**": allow
    question: allow
    bash: ask
    external_directory: deny
    task:
      "*": deny
      research: allow
      code: allow
      architect: allow

  delivery:
    read: allow
    glob: allow
    grep: allow
    skill:
      "*": deny
      ai-memory: allow
      delivery-policy: allow
      memory-maintenance: allow
      ponytail-review: allow
    edit: ask
    question: allow
    bash:
      "*": ask
      "git commit*": allow
    external_directory: deny
    task:
      "*": deny
      research: allow
      code: allow
      architect: allow
      reviewer: allow

  research:
    read: allow
    glob: allow
    grep: allow
    skill: deny
    webfetch: allow
    websearch: allow
    edit: ask
    bash: deny
    external_directory: deny
    task: deny

  code:
    read: allow
    glob: allow
    grep: allow
    skill: deny
    edit: allow
    bash: ask
    external_directory: deny
    task: deny

  implementer:
    read: allow
    glob: allow
    grep: allow
    skill:
      "*": deny
      ai-memory: allow
      implementation-quality: allow
      memory-maintenance: allow
    edit: allow
    question: allow
    bash:
      "*": ask
      "git status --short": allow
      "git log --oneline -10": allow
      "npx tsx .opencode/skills/ai-memory/scripts/ai-memory.ts status --json": allow
      "npx tsx .opencode/skills/ai-memory/scripts/ai-memory.ts close-check": allow
      "git commit*": allow
    external_directory: deny
    task:
      "*": deny
      scout: allow

  auditor:
    read: allow
    glob: allow
    grep: allow
    skill:
      "*": deny
      ai-memory: allow
      memory-maintenance: allow
      review-triage: allow
    webfetch: allow
    websearch: allow
    edit:
      "*": deny
      "docs/ai/plans/**": allow
      "docs/ai/logs/**": allow
    bash: ask
    external_directory: deny
    task:
      "*": deny
      scout: allow

  scout:
    read: allow
    glob: allow
    grep: allow
    skill: deny
    webfetch: allow
    websearch: allow
    edit: deny
    bash: deny
    external_directory: deny
    task: deny

  reviewer:
    read: allow
    glob: allow
    grep: allow
    skill: deny
    edit: deny
    bash: ask
    external_directory: deny
    task: deny

  troubleshooter:
    read: allow
    glob: allow
    grep: allow
    skill: deny
    edit: ask
    question: allow
    bash: ask
    external_directory: deny
    task: deny

  architect:
    read: allow
    glob: allow
    grep: allow
    skill: deny
    edit: deny
    bash: deny
    external_directory: deny
    task: deny
